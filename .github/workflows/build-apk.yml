name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Print keystore SHA-1
        run: |
          echo "=== SHA-1 FINGERPRINT ==="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android 2>/dev/null | grep SHA1

      - name: Check required dependencies are still declared
        # These three once vanished from the build files and cached compilation hid
        # it for eight days. They are declared in the version catalog and wired in
        # through libs.* aliases, so BOTH files have to be checked - grepping only
        # app/build.gradle.kts for the artifact name gives a false alarm.
        run: |
          fail=0
          check() {
            if ! grep -qF "$2" "$1"; then
              echo "MISSING in $1 : $3"
              fail=1
            fi
          }
          check gradle/libs.versions.toml firebase-messaging  "catalog entry for firebase-messaging"
          check gradle/libs.versions.toml firebase-analytics  "catalog entry for firebase-analytics"
          check gradle/libs.versions.toml zxing-core         "catalog entry for zxing-core"
          check app/build.gradle.kts libs.firebase.messaging  "implementation(libs.firebase.messaging)"
          check app/build.gradle.kts libs.firebase.analytics  "implementation(libs.firebase.analytics)"
          check app/build.gradle.kts libs.zxing.core          "implementation(libs.zxing.core)"
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "A required dependency is no longer declared. Fix the build files before shipping."
            exit 1
          fi
          echo "All required dependencies present."

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wagmiya-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
