name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Print keystore SHA-1
        run: |
          echo "=== SHA-1 FINGERPRINT ==="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android 2>/dev/null | grep SHA1

      - name: Check required dependencies are still declared
        run: |
          fail=0
          for dep in firebase-messaging firebase-analytics zxing-core; do
            if ! grep -q "$dep" app/build.gradle.kts; then
              echo "MISSING from app/build.gradle.kts: $dep"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "A required dependency has disappeared from the build file."
            echo "This happened once and cached compilation hid it for eight days."
            exit 1
          fi
          echo "All required dependencies present."

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wagmiya-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
