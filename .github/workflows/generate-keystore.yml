name: Generate Upload Keystore (one time)

# Run this ONCE. It creates the Play Store upload keystore using the
# STORE_PASSWORD + KEY_PASSWORD secrets, prints the base64 text (which you copy
# into the KEYSTORE_BASE64 secret) and uploads the .jks file as an artifact.
# After you have the keystore and the KEYSTORE_BASE64 secret, you can delete
# this workflow file.

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate upload keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore petpulse-upload.jks \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Petpulse, O=Petpulse, L=Kochi, ST=Kerala, C=IN"
          base64 -w 0 petpulse-upload.jks > keystore-base64.txt
          echo ""
          echo "=========== COPY EVERYTHING BETWEEN THESE TWO LINES ==========="
          cat keystore-base64.txt
          echo ""
          echo "=========== END OF BASE64 (paste into KEYSTORE_BASE64 secret) ==========="
          ls -la petpulse-upload.jks

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: petpulse-upload-keystore
          path: |
            petpulse-upload.jks
            keystore-base64.txt
